<!DOCTYPE html>
<html lang="ja">
<head>

<style>
:root { --bg: #1B1035; --bg2: #2A1856; --panel: rgba(255,255,255,.08); --text: #FFF7E8; --muted: #C9BDE6; --accent: #FFD43B; --accent2: #FF5E8A; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { background: radial-gradient(120% 80% at 50% 0%, var(--bg2), var(--bg) 70%); background-color: var(--bg); color: var(--text); font: 15px/1.5 "Hiragino Maru Gothic ProN", "M PLUS Rounded 1c", "Yu Gothic", "Noto Sans JP", sans-serif; user-select: none; -webkit-user-select: none; overflow-x: hidden; }
#app { max-width: 480px; margin: 0 auto; padding: 12px 16px 24px; }
.hud { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 8px; align-items: stretch; }
.box { background: var(--panel); border-radius: 14px; padding: 6px 8px; text-align: center; }
.box .lbl { font-size: 11px; color: var(--muted); letter-spacing: .05em; }
.box .val { font-size: 22px; font-weight: bold; line-height: 1.2; }
#moves.low { color: var(--accent2); }
.bar { position: relative; height: 8px; background: rgba(0,0,0,.35); border-radius: 4px; margin-top: 4px; overflow: visible; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #FFB703, var(--accent)); border-radius: 4px; transition: width .3s; }
.bar b { position: absolute; top: -5px; width: 12px; height: 12px; margin-left: -6px; font-size: 11px; line-height: 12px; color: #776; }
.bar b.on { color: var(--accent); }
.goals { display: flex; justify-content: center; gap: 10px; min-height: 30px; margin: 10px 0 8px; flex-wrap: wrap; }
.goal { display: flex; align-items: center; gap: 5px; background: var(--panel); border-radius: 999px; padding: 3px 10px 3px 4px; font-weight: bold; }
.goal canvas { width: 22px; height: 22px; }
.goal.done { color: #7CFFB2; }
.goal.score { padding-left: 10px; font-weight: normal; color: var(--muted); }
.goal.score b { color: var(--text); }
#wrap { position: relative; }
canvas#board { display: block; width: 100%; aspect-ratio: 1; border-radius: 16px; touch-action: none; background: rgba(0,0,0,.25); }
.toolbar { display: flex; justify-content: space-between; margin-top: 12px; }
button { font: inherit; color: var(--text); background: var(--panel); border: 0; border-radius: 999px; padding: 8px 16px; cursor: pointer; }
button:active { transform: scale(.96); }
button.primary { background: linear-gradient(180deg, #FFD43B, #FFA41B); color: #3A2200; font-weight: bold; font-size: 18px; padding: 12px 32px; box-shadow: 0 4px 0 #B86E00; }
.overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(12,6,30,.72); z-index: 10; padding: 16px; }
.overlay.show { display: flex; }
.card { background: linear-gradient(180deg, #3B2475, #241447); border: 2px solid rgba(255,255,255,.15); border-radius: 22px; padding: 24px 20px; width: 100%; max-width: 380px; max-height: 90vh; overflow-y: auto; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,.5); animation: pop .35s cubic-bezier(.2,1.5,.5,1); }
@keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.card h1 { margin: 0 0 4px; font-size: 34px; background: linear-gradient(180deg, #FFF3A8, #FFB703); -webkit-background-clip: text; background-clip: text; color: transparent; }
.card h2 { margin: 0 0 8px; font-size: 26px; }
.card p { color: var(--muted); margin: 6px 0 16px; }
.stars { font-size: 40px; letter-spacing: 6px; color: #5B4A86; margin: 6px 0; }
.stars span.on { color: var(--accent); text-shadow: 0 0 12px rgba(255,212,59,.6); }
.levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 16px 0 4px; }
.levels button { padding: 8px 0 4px; border-radius: 12px; font-weight: bold; font-size: 16px; line-height: 1.1; }
.levels button small { display: block; font-size: 10px; color: var(--accent); letter-spacing: 1px; min-height: 12px; }
.levels button:disabled { opacity: .35; cursor: default; }
.levels button.cur { outline: 2px solid var(--accent); }
.row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.help { font-size: 13px; text-align: left; color: var(--muted); background: rgba(0,0,0,.2); border-radius: 12px; padding: 10px 12px; margin-top: 12px; }
.help b { color: var(--text); }
.toast { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); font-size: 28px; font-weight: bold; color: #fff; text-shadow: 0 2px 0 #7A2BD9, 0 0 16px rgba(255,255,255,.6); pointer-events: none; opacity: 0; transition: opacity .2s; white-space: nowrap; }
.toast.show { opacity: 1; }
footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 16px; }
footer a { color: var(--muted); }
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <div class="box"><div class="lbl">レベル</div><div class="val" id="level">1</div></div>
    <div class="box"><div class="lbl">スコア</div><div class="val" id="score">0</div>
      <div class="bar"><i id="bar"></i><b id="st1" style="left:55%">★</b><b id="st2" style="left:77%">★</b><b id="st3" style="left:100%">★</b></div></div>

  </div>

</div>

<div class="overlay" id="ovTitle"><div class="card">
  <h1>ジュエルポップ</h1>
  <p>同じ色の宝石を3つ以上そろえて消そう！</p>
  <button class="primary" id="btnContinue">プレイ</button>
  <div class="levels" id="levelGrid"></div>
  <div class="help">
    <b>あそびかた</b><br>
    となりの宝石をスワイプ（またはタップ2回）で入れかえて、3つ以上ならべると消えます。<br>
    <b>4つ</b>ならべる → ライン宝石（1列まるごと消す）<br>
    <b>L字・T字</b> → ボム宝石（まわりを爆破）<br>
    <b>5つ</b>ならべる → レインボー（入れかえた色をぜんぶ消す）<br>
    特殊な宝石どうしを入れかえると、もっと大きな効果が！
  </div>
</div></div>

<div class="overlay" id="ovStart"><div class="card">
  <h2 id="startTitle">レベル 1</h2>
  <p id="startDesc"></p>
  <div class="goals" id="startGoals"></div>
  <button class="primary" id="btnGo">スタート</button>
</div></div>

<div class="overlay" id="ovWin"><div class="card">
  <h2>クリア！</h2>
  <div class="stars" id="winStars"><span>★</span><span>★</span><span>★</span></div>
  <p id="winScore"></p>
  <div class="row"><button id="btnWinMenu">メニュー</button><button class="primary" id="btnNext">つぎへ</button></div>
</div></div>

<div class="overlay" id="ovLose"><div class="card">
  <h2>手数ぎれ…</h2>
  <p id="loseDesc">もう少しだった！</p>
  <div class="row"><button id="btnLoseMenu">メニュー</button><button class="primary" id="btnRetry">もういちど</button></div>
</div></div>

<script>
'use strict';
// ===== 定数 =====
const N = 8;
const COLORS = [
  { base: '#FF4D5E', light: '#FFB3BB', dark: '#A3122A', name: 'あか' },
  { base: '#FF9F1C', light: '#FFD9A0', dark: '#A85A00', name: 'オレンジ' },
  { base: '#FFD43B', light: '#FFF6C2', dark: '#A88300', name: 'きいろ' },
  { base: '#2FD67B', light: '#B8F7D2', dark: '#0B7A3F', name: 'みどり' },
  { base: '#3B9DFF', light: '#BFE0FF', dark: '#0B4FA3', name: 'あお' },
  { base: '#B06CFF', light: '#E3CCFF', dark: '#5B1FA8', name: 'むらさき' },
];
const RAINBOW = -1;
const SWAP_SPEED = 9;   // マス/秒
const GRAVITY = 70;     // マス/秒^2
const POINT = 30;

// ===== 保存（使えない環境でも動くように try/catch） =====
const store = {
  get(k, d) { try { const v = localStorage.getItem('jewelpop.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('jewelpop.' + k, JSON.stringify(v)); } catch (e) {} },
};
let unlocked = store.get('unlocked', 1);
let bestStars = store.get('stars', {});
let soundOn = store.get('sound', true);

// ===== レベル設定 =====
function levelConfig(n) {
  const numColors = n <= 4 ? 5 : 6;
  const moves = 18 + (n % 3) * 2 + Math.min(8, Math.floor(n / 6));
  const target = Math.round((900 + n * 350) / 100) * 100;
  const goals = {};
  if (n >= 3) {
    const k = Math.min(45, 10 + Math.floor(n * 1.6));
    const c1 = (n * 2) % numColors, c2 = (n * 2 + 3) % numColors;
    if (n % 2 === 1) { goals[c1] = k; goals[c2] = k; }
    else if (n % 4 === 0) { goals[c1] = Math.round(k * 1.4); }
  }
  return { n, numColors, moves, target, goals, stars: [target, Math.round(target * 1.4), Math.round(target * 1.8)] };
}

// ===== 状態 =====
let cfg, grid, score, movesLeft, collected, busy = true, selected = null, chainCount = 0;
let dying = [], particles = [], beams = [], popups = [];
let waiters = [];
let hintMove = null, idleTime = 0, playing = false;
let gemId = 0;

function makeGem(color, special = null, r = 0, c = 0) {
  return { id: gemId++, color, special, x: c, y: r, vy: 0, falling: false, scale: 1, alpha: 1 };
}
function randColor() { return Math.floor(Math.random() * cfg.numColors); }
const colorAt = (r, c) => (r >= 0 && r < N && c >= 0 && c < N && grid[r][c]) ? grid[r][c].color : -9;
const key = (r, c) => r * N + c;

// ===== 盤面生成 =====
function fillBoard() {
  for (let tries = 0; tries < 200; tries++) {
    grid = [];
    for (let r = 0; r < N; r++) {
      grid.push([]);
      for (let c = 0; c < N; c++) {
        let col;
        do { col = randColor(); }
        while ((c >= 2 && grid[r][c - 1].color === col && grid[r][c - 2].color === col) ||
               (r >= 2 && grid[r - 1][c].color === col && grid[r - 2][c].color === col));
        const g = makeGem(col, null, r - N - 1, c);
        g.falling = true;
        grid[r].push(g);
      }
    }
    if (findMove()) return;
  }
}

// ===== マッチ判定 =====
function findMatches() {
  const runs = [];
  for (let r = 0; r < N; r++) {
    let c = 0;
    while (c < N) {
      const col = colorAt(r, c); let e = c;
      while (col >= 0 && e + 1 < N && colorAt(r, e + 1) === col) e++;
      if (col >= 0 && e - c + 1 >= 3) { const cells = []; for (let i = c; i <= e; i++) cells.push([r, i]); runs.push({ cells, dir: 'h', color: col }); }
      c = e + 1;
    }
  }
  for (let c = 0; c < N; c++) {
    let r = 0;
    while (r < N) {
      const col = colorAt(r, c); let e = r;
      while (col >= 0 && e + 1 < N && colorAt(e + 1, c) === col) e++;
      if (col >= 0 && e - r + 1 >= 3) { const cells = []; for (let i = r; i <= e; i++) cells.push([i, c]); runs.push({ cells, dir: 'v', color: col }); }
      r = e + 1;
    }
  }
  // 交差する同色ランをまとめる（L字・T字）
  const parent = runs.map((_, i) => i);
  const find = i => parent[i] === i ? i : (parent[i] = find(parent[i]));
  const owner = new Map();
  runs.forEach((run, i) => run.cells.forEach(([r, c]) => {
    const k = key(r, c);
    if (owner.has(k)) parent[find(i)] = find(owner.get(k)); else owner.set(k, i);
  }));
  const groups = new Map();
  runs.forEach((run, i) => {
    const root = find(i);
    if (!groups.has(root)) groups.set(root, { cells: new Map(), color: run.color, dirs: new Set(), maxRun: 0, runs: [] });
    const g = groups.get(root);
    run.cells.forEach(([r, c]) => g.cells.set(key(r, c), [r, c]));
    g.dirs.add(run.dir); g.maxRun = Math.max(g.maxRun, run.cells.length); g.runs.push(run);
  });
  return [...groups.values()];
}

function matchAt(r, c) {
  const col = colorAt(r, c);
  if (col < 0) return false;
  let h = 1, v = 1;
  for (let i = c - 1; colorAt(r, i) === col; i--) h++;
  for (let i = c + 1; colorAt(r, i) === col; i++) h++;
  for (let i = r - 1; colorAt(i, c) === col; i--) v++;
  for (let i = r + 1; colorAt(i, c) === col; i++) v++;
  return h >= 3 || v >= 3;
}

function findMove() {
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    for (const [dr, dc] of [[0, 1], [1, 0]]) {
      const r2 = r + dr, c2 = c + dc;
      if (r2 >= N || c2 >= N) continue;
      const a = grid[r][c], b = grid[r2][c2];
      if (!a || !b) continue;
      if (a.color === RAINBOW || b.color === RAINBOW || (a.special && b.special)) return [r, c, r2, c2];
      grid[r][c] = b; grid[r2][c2] = a;
      const ok = matchAt(r, c) || matchAt(r2, c2);
      grid[r][c] = a; grid[r2][c2] = b;
      if (ok) return [r, c, r2, c2];
    }
  }
  return null;
}

// ===== 待機ユーティリティ =====
const sleep = ms => new Promise(res => setTimeout(res, ms));
function settled() {
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) { const g = grid[r][c]; if (g && (g.x !== c || g.y !== r)) return false; }
  return true;
}
const settle = () => new Promise(res => waiters.push(res));

// ===== 特殊効果の範囲 =====
function mostCommonColor() {
  const cnt = new Array(cfg.numColors).fill(0);
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) { const col = colorAt(r, c); if (col >= 0) cnt[col]++; }
  return cnt.indexOf(Math.max(...cnt));
}
function cellsOfColor(col) {
  const out = [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (colorAt(r, c) === col) out.push([r, c]);
  return out;
}
function rowCells(r) { const o = []; if (r >= 0 && r < N) for (let c = 0; c < N; c++) o.push([r, c]); return o; }
function colCells(c) { const o = []; if (c >= 0 && c < N) for (let r = 0; r < N; r++) o.push([r, c]); return o; }
function areaCells(r, c, rad) {
  const o = [];
  for (let i = r - rad; i <= r + rad; i++) for (let j = c - rad; j <= c + rad; j++) if (i >= 0 && i < N && j >= 0 && j < N) o.push([i, j]);
  return o;
}
function effectCells(g, r, c) {
  switch (g.special) {
    case 'lineH': beams.push({ dir: 'h', i: r, life: 1, color: g.color }); return rowCells(r);
    case 'lineV': beams.push({ dir: 'v', i: c, life: 1, color: g.color }); return colCells(c);
    case 'wrap': shock(r, c, 1.5); return areaCells(r, c, 1);
    case 'rainbow': { const col = mostCommonColor(); rays(r, c, col); return cellsOfColor(col); }
  }
  return [];
}

// ===== 消去 =====
async function clearCells(set, creates = []) {
  // 特殊宝石の連鎖発動
  const queue = [...set.keys()];
  const triggered = new Set();
  let usedSpecial = false;
  while (queue.length) {
    const k = queue.pop();
    const [r, c] = set.get(k);
    const g = grid[r][c];
    if (!g || !g.special || triggered.has(g.id)) continue;
    triggered.add(g.id); usedSpecial = true;
    for (const [rr, cc] of effectCells(g, r, c)) {
      const kk = key(rr, cc);
      if (!set.has(kk)) { set.set(kk, [rr, cc]); queue.push(kk); }
    }
  }
  if (usedSpecial) sfx('special');
  sfx('match', chainCount);
  const mult = Math.max(1, chainCount);
  let gained = 0;
  for (const [r, c] of set.values()) {
    const g = grid[r][c];
    if (!g) continue;
    if (g.color >= 0 && collected[g.color] !== undefined) collected[g.color]++;
    gained += POINT * mult;
    burst(c + .5, r + .5, g.color >= 0 ? COLORS[g.color].base : '#ffffff', 6);
    dying.push({ g, r, c });
    grid[r][c] = null;
  }
  for (const cr of creates) {
    const g = makeGem(cr.type === 'rainbow' ? RAINBOW : cr.color, cr.type, cr.r, cr.c);
    g.scale = 1.6;
    grid[cr.r][cr.c] = g;
    gained += cr.type === 'rainbow' ? 200 : 60;
  }
  if (gained) {
    let cx = 0, cy = 0; for (const [r, c] of set.values()) { cx += c; cy += r; }
    popups.push({ x: cx / set.size + .5, y: cy / set.size + .5, text: '+' + gained, life: 1 });
  }
  score += gained;
  updateHud();
  await sleep(usedSpecial ? 260 : 180);
}

function applyGravity() {
  for (let c = 0; c < N; c++) {
    let w = N - 1;
    for (let r = N - 1; r >= 0; r--) {
      const g = grid[r][c];
      if (g) { if (w !== r) { grid[w][c] = g; grid[r][c] = null; g.falling = true; } w--; }
    }
    const missing = w + 1;
    for (let r = w; r >= 0; r--) {
      const g = makeGem(randColor(), null, r - missing, c);
      g.falling = true;
      grid[r][c] = g;
    }
  }
  return settle();
}

async function resolveBoard(initial, swapCells) {
  chainCount = 0;
  if (initial) { chainCount = 1; await clearCells(initial); await applyGravity(); }
  while (true) {
    const groups = findMatches();
    if (!groups.length) break;
    chainCount++;
    const set = new Map(); const creates = [];
    for (const grp of groups) {
      for (const [k, rc] of grp.cells) set.set(k, rc);
      let type = null;
      if (grp.maxRun >= 5) type = 'rainbow';
      else if (grp.dirs.size === 2) type = 'wrap';
      else if (grp.maxRun === 4) type = grp.runs[0].dir === 'h' ? 'lineV' : 'lineH';
      if (type) {
        let pos = null;
        if (swapCells && chainCount === 1) pos = swapCells.find(([r, c]) => grp.cells.has(key(r, c)));
        if (!pos) { const cells = [...grp.cells.values()]; pos = cells[Math.floor(cells.length / 2)]; }
        creates.push({ r: pos[0], c: pos[1], color: grp.color, type });
      }
    }
    // 生成位置の宝石は特殊発動させずに作りかえる
    for (const cr of creates) { const g = grid[cr.r][cr.c]; if (g && !g.special) set.delete(key(cr.r, cr.c)), dyingQuiet(cr.r, cr.c); }
    await clearCells(set, creates);
    await applyGravity();
    if (chainCount >= 3) toast(['すごい！', 'すばらしい！', 'さいこう！', 'ゴージャス！'][Math.min(3, chainCount - 3)]);
  }
}
function dyingQuiet(r, c) {
  const g = grid[r][c];
  if (g.color >= 0 && collected[g.color] !== undefined) collected[g.color]++;
  burst(c + .5, r + .5, COLORS[g.color].base, 6);
  grid[r][c] = null;
}

// ===== 入れかえ =====
async function trySwap(r1, c1, r2, c2) {
  if (busy) return;
  busy = true; selected = null; hintMove = null; idleTime = 0;
  const a = grid[r1][c1], b = grid[r2][c2];
  grid[r1][c1] = b; grid[r2][c2] = a;
  sfx('swap');
  await settle();
  // a は (r2,c2)、b は (r1,c1) にいる
  const combo = a.color === RAINBOW || b.color === RAINBOW || (a.special && b.special);
  if (combo) {
    movesLeft--; updateHud();
    await resolveBoard(comboCells(a, r2, c2, b, r1, c1));
  } else if (matchAt(r1, c1) || matchAt(r2, c2)) {
    movesLeft--; updateHud();
    await resolveBoard(null, [[r2, c2], [r1, c1]]);
  } else {
    sfx('bad');
    grid[r1][c1] = a; grid[r2][c2] = b;
    await settle();
    busy = false;
    return;
  }
  await endTurn();
}

function comboCells(a, ra, ca, b, rb, cb) {
  const set = new Map();
  const add = list => list.forEach(([r, c]) => set.set(key(r, c), [r, c]));
  const isLine = g => g.special === 'lineH' || g.special === 'lineV';
  const aR = a.color === RAINBOW, bR = b.color === RAINBOW;
  if (aR && bR) {
    toast('ぜんけし！');
    for (let r = 0; r < N; r++) add(rowCells(r));
    shock(ra, ca, 8);
  } else if (aR || bR) {
    const [rg, rr, rc, other] = aR ? [a, ra, ca, b] : [b, rb, cb, a];
    const col = other.color;
    rays(rr, rc, col);
    const cells = cellsOfColor(col);
    if (other.special) {
      // 同じ色をぜんぶ特殊宝石に変えてから発動
      cells.forEach(([r, c]) => { const g = grid[r][c]; g.special = other.special === 'wrap' ? 'wrap' : (Math.random() < .5 ? 'lineH' : 'lineV'); });
    }
    add(cells); add([[rr, rc]]);
    rg.special = null;
  } else if (isLine(a) && isLine(b)) {
    a.special = b.special = null;
    beams.push({ dir: 'h', i: ra, life: 1, color: a.color }, { dir: 'v', i: ca, life: 1, color: b.color });
    add(rowCells(ra)); add(colCells(ca)); add([[rb, cb]]);
  } else if (a.special === 'wrap' && b.special === 'wrap') {
    a.special = b.special = null;
    shock(ra, ca, 3); add(areaCells(ra, ca, 2)); add([[rb, cb]]);
  } else {
    // ライン + ボム：3行3列
    a.special = b.special = null;
    for (let d = -1; d <= 1; d++) {
      add(rowCells(ra + d)); add(colCells(ca + d));
      beams.push({ dir: 'h', i: ra + d, life: 1, color: a.color }, { dir: 'v', i: ca + d, life: 1, color: b.color });
    }
    add([[rb, cb]]);
  }
  return set;
}

// ===== ターン終了 =====
function goalsMet() {
  if (score < cfg.target) return false;
  for (const col in cfg.goals) if (collected[col] < cfg.goals[col]) return false;
  return true;
}
async function endTurn() {
  updateHud();
  if (goalsMet()) {
    const bonus = movesLeft * 150;
    if (bonus) { toast('のこり手数ボーナス +' + bonus); score += bonus; updateHud(); await sleep(900); }
    return win();
  }
  if (movesLeft <= 0) { await sleep(300); return lose(); }
  if (!findMove()) { toast('シャッフル！'); await sleep(500); shuffle(); await settle(); }
  busy = false; idleTime = 0;
}

function shuffle() {
  const gems = [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) gems.push(grid[r][c]);
  for (let t = 0; t < 300; t++) {
    for (let i = gems.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [gems[i], gems[j]] = [gems[j], gems[i]]; }
    for (let i = 0; i < gems.length; i++) grid[Math.floor(i / N)][i % N] = gems[i];
    if (!findMatches().length && findMove()) return;
  }
  // どうしても見つからない場合は色を振り直す
  const old = grid; fillBoard();
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) { grid[r][c].x = old[r][c].x; grid[r][c].y = old[r][c].y; grid[r][c].falling = false; }
}

// ===== レベル開始・終了 =====
function startLevel(n) {
  cfg = levelConfig(n);
  score = 0; movesLeft = cfg.moves; collected = {};
  for (const col in cfg.goals) collected[col] = 0;
  dying = []; particles = []; beams = []; popups = []; selected = null; hintMove = null;
  fillBoard();
  updateHud();
  playing = true;
  settle().then(() => { busy = false; idleTime = 0; });
}
function starCount() { return cfg.stars.filter(s => score >= s).length; }
function win() {
  playing = false; sfx('win');
  const s = Math.max(1, starCount());
  if ((bestStars[cfg.n] || 0) < s) { bestStars[cfg.n] = s; store.set('stars', bestStars); }
  if (unlocked < cfg.n + 1) { unlocked = cfg.n + 1; store.set('unlocked', unlocked); }
  [...$('winStars').children].forEach((el, i) => el.classList.toggle('on', i < s));
  $('winScore').textContent = 'スコア ' + score.toLocaleString();
  show('ovWin');
}
function lose() {
  playing = false; sfx('lose');
  const rest = [];
  if (score < cfg.target) rest.push('スコアあと ' + (cfg.target - score).toLocaleString());
  for (const col in cfg.goals) { const left = cfg.goals[col] - collected[col]; if (left > 0) rest.push(COLORS[col].name + 'あと ' + left + 'こ'); }
  $('loseDesc').textContent = rest.join('、') || 'もう少しだった！';
  show('ovLose');
}

// ===== UI =====
const $ = id => document.getElementById(id);
function show(id) { document.querySelectorAll('.overlay').forEach(o => o.classList.toggle('show', o.id === id)); }
function hideAll() { show(null); }
let toastTimer;
function toast(text) {
  const t = $('toast'); t.textContent = text; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 900);
}

function goalChip(col, text, done) {
  const div = document.createElement('div');
  div.className = 'goal' + (done ? ' done' : '');
  const cv = document.createElement('canvas'); cv.width = cv.height = 44;
  const cx = cv.getContext('2d'); cx.translate(22, 22); drawGemShape(cx, makeGem(+col), 18, 0);
  div.appendChild(cv);
  div.appendChild(document.createTextNode(text));
  return div;
}
function renderGoals(el, live) {
  el.innerHTML = '';
  const sc = document.createElement('div'); sc.className = 'goal score';
  sc.innerHTML = 'めざせ <b>' + cfg.target.toLocaleString() + '</b> 点';
  el.appendChild(sc);
  for (const col in cfg.goals) {
    if (live) { const left = Math.max(0, cfg.goals[col] - collected[col]); el.appendChild(goalChip(col, left ? left : '✓', !left)); }
    else el.appendChild(goalChip(col, '× ' + cfg.goals[col], false));
  }
}
function updateHud() {
  $('level').textContent = cfg.n;
  $('score').textContent = score.toLocaleString();
  $('moves').textContent = movesLeft;
  $('moves').classList.toggle('low', movesLeft <= 5);
  const max = cfg.stars[2];
  $('bar').style.width = Math.min(100, score / max * 100) + '%';
  cfg.stars.forEach((s, i) => { const el = $('st' + (i + 1)); el.style.left = (s / max * 100) + '%'; el.classList.toggle('on', score >= s); });
  renderGoals($('goals'), true);
}

function openTitle() {
  playing = false; busy = true;
  const lg = $('levelGrid'); lg.innerHTML = '';
  const total = Math.max(20, Math.ceil((unlocked + 5) / 5) * 5);
  for (let i = 1; i <= total; i++) {
    const b = document.createElement('button');
    const s = bestStars[i] || 0;
    b.innerHTML = i + '<small>' + '★'.repeat(s) + '</small>';
    b.disabled = i > unlocked;
    if (i === unlocked) b.classList.add('cur');
    b.onclick = () => openStart(i);
    lg.appendChild(b);
  }
  $('btnContinue').textContent = unlocked > 1 ? 'つづきから（レベル ' + unlocked + '）' : 'プレイ';
  show('ovTitle');
}
function openStart(n) {
  unlockAudio();
  cfg = levelConfig(n);
  collected = {}; for (const col in cfg.goals) collected[col] = 0;
  $('startTitle').textContent = 'レベル ' + n;
  $('startDesc').textContent = cfg.moves + ' 手以内にクリアしよう';
  renderGoals($('startGoals'), false);
  show('ovStart');
  $('btnGo').onclick = () => { hideAll(); startLevel(n); };
}
$('btnContinue').onclick = () => openStart(unlocked);
$('btnMenu').onclick = () => { if (playing && busy) return; openTitle(); };
$('btnWinMenu').onclick = openTitle;
$('btnLoseMenu').onclick = openTitle;
$('btnNext').onclick = () => openStart(cfg.n + 1);
$('btnRetry').onclick = () => openStart(cfg.n);
$('btnSound').onclick = () => { soundOn = !soundOn; store.set('sound', soundOn); $('btnSound').textContent = soundOn ? '🔊' : '🔇'; unlockAudio(); };
$('btnSound').textContent = soundOn ? '🔊' : '🔇';

// ===== サウンド（WebAudio で生成） =====
let actx = null;
function unlockAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
}
function tone(freq, dur, type = 'sine', vol = .15, delay = 0, slide = 0) {
  if (!actx || !soundOn) return;
  const t = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + .02);
}
function sfx(name, n = 1) {
  switch (name) {
    case 'swap': tone(520, .08, 'triangle', .1); break;
    case 'bad': tone(220, .12, 'square', .06); tone(180, .15, 'square', .06, .1); break;
    case 'match': { const base = [523, 587, 659, 784, 880, 988, 1047][Math.min(6, n - 1)]; tone(base, .18, 'triangle', .14); tone(base * 1.5, .15, 'sine', .07, .04); break; }
    case 'special': tone(300, .35, 'sawtooth', .07, 0, 3); break;
    case 'win': [523, 659, 784, 1047].forEach((f, i) => tone(f, .3, 'triangle', .15, i * .12)); break;
    case 'lose': [392, 330, 262].forEach((f, i) => tone(f, .35, 'triangle', .12, i * .18)); break;
  }
}

// ===== 描画 =====
const canvas = $('board');
const ctx = canvas.getContext('2d');
let W = 0, cell = 0, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = canvas.clientWidth;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(W * dpr);
  cell = W / N;
}
window.addEventListener('resize', resize);

function shapePath(c, shape, s) {
  c.beginPath();
  const poly = (n, rot, rad = s) => { for (let i = 0; i < n; i++) { const a = rot + i * Math.PI * 2 / n; i ? c.lineTo(Math.cos(a) * rad, Math.sin(a) * rad) : c.moveTo(Math.cos(a) * rad, Math.sin(a) * rad); } c.closePath(); };
  switch (shape) {
    case 0: poly(8, Math.PI / 8, s * 1.02); break;               // ルビー：八角形
    case 1: c.arc(0, 0, s * .95, 0, Math.PI * 2); break;        // オレンジ：まる
    case 2: c.moveTo(0, -s * 1.05); c.lineTo(s * .85, 0); c.lineTo(0, s * 1.05); c.lineTo(-s * .85, 0); c.closePath(); break; // ダイヤ
    case 3: poly(6, 0, s * 1.02); break;                        // エメラルド：六角形
    case 4: { const r = s * .3, e = s * .88; c.moveTo(-e + r, -e); c.arcTo(e, -e, e, e, r); c.arcTo(e, e, -e, e, r); c.arcTo(-e, e, -e, -e, r); c.arcTo(-e, -e, e, -e, r); c.closePath(); break; } // サファイア：角丸
    case 5: poly(3, -Math.PI / 2, s * 1.12); c.closePath(); break; // アメジスト：三角
    default: c.arc(0, 0, s * .95, 0, Math.PI * 2);
  }
}

function drawGemShape(c, g, s, t) {
  if (g.color === RAINBOW) {
    // レインボー
    c.save();
    c.rotate(t * 1.5);
    for (let i = 0; i < 6; i++) {
      c.beginPath(); c.moveTo(0, 0);
      c.arc(0, 0, s * .95, i * Math.PI / 3, (i + 1) * Math.PI / 3);
      c.closePath(); c.fillStyle = COLORS[i].base; c.fill();
    }
    c.restore();
    const rg = c.createRadialGradient(-s * .3, -s * .3, s * .1, 0, 0, s);
    rg.addColorStop(0, 'rgba(255,255,255,.9)'); rg.addColorStop(.35, 'rgba(255,255,255,.2)'); rg.addColorStop(1, 'rgba(0,0,0,.25)');
    c.beginPath(); c.arc(0, 0, s * .95, 0, Math.PI * 2); c.fillStyle = rg; c.fill();
    c.lineWidth = s * .08; c.strokeStyle = '#fff'; c.stroke();
    return;
  }
  const col = COLORS[g.color];
  shapePath(c, g.color, s);
  const grd = c.createRadialGradient(-s * .35, -s * .4, s * .05, 0, 0, s * 1.2);
  grd.addColorStop(0, col.light); grd.addColorStop(.45, col.base); grd.addColorStop(1, col.dark);
  c.fillStyle = grd; c.fill();
  c.lineWidth = s * .08; c.strokeStyle = col.dark; c.stroke();
  // ファセット
  c.save(); shapePath(c, g.color, s * .55);
  c.fillStyle = 'rgba(255,255,255,.18)'; c.fill(); c.restore();
  // ハイライト
  c.beginPath(); c.ellipse(-s * .3, -s * .38, s * .28, s * .14, -.6, 0, Math.PI * 2);
  c.fillStyle = 'rgba(255,255,255,.75)'; c.fill();
  // 特殊
  if (g.special === 'lineH' || g.special === 'lineV') {
    c.save(); shapePath(c, g.color, s); c.clip();
    if (g.special === 'lineV') c.rotate(Math.PI / 2);
    c.fillStyle = 'rgba(255,255,255,.85)';
    for (let i = -1; i <= 1; i++) c.fillRect(-s * 1.2, i * s * .42 - s * .09, s * 2.4, s * .18);
    c.restore();
  } else if (g.special === 'wrap') {
    const p = .5 + .5 * Math.sin(t * 6);
    c.beginPath(); c.arc(0, 0, s * (1.05 + .08 * p), 0, Math.PI * 2);
    c.lineWidth = s * .14; c.strokeStyle = `rgba(255,255,255,${.5 + .4 * p})`; c.stroke();
    c.beginPath(); c.arc(0, 0, s * .28, 0, Math.PI * 2); c.fillStyle = '#fff'; c.fill();
  }
}

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 4;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2, life: .6 + Math.random() * .3, color, size: .06 + Math.random() * .07 });
  }
}
function shock(r, c, rad) { popups.push({ ring: true, x: c + .5, y: r + .5, rad, life: 1 }); }
function rays(r, c, col) { for (const [rr, cc] of cellsOfColor(col)) popups.push({ ray: true, x0: c + .5, y0: r + .5, x: cc + .5, y: rr + .5, life: 1 }); }

function update(dt, t) {
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const g = grid[r][c]; if (!g) continue;
    if (g.x !== c) { const d = c - g.x, st = SWAP_SPEED * dt; g.x = Math.abs(d) <= st ? c : g.x + Math.sign(d) * st; }
    if (g.y !== r) {
      if (g.falling && g.y < r) {
        g.vy += GRAVITY * dt; g.y += g.vy * dt;
        if (g.y >= r) { g.y = r; g.vy = 0; g.falling = false; }
      } else { const d = r - g.y, st = SWAP_SPEED * dt; g.y = Math.abs(d) <= st ? r : g.y + Math.sign(d) * st; }
    } else { g.falling = false; g.vy = 0; }
    g.scale += (1 - g.scale) * Math.min(1, dt * 10);
  }
  dying = dying.filter(d => (d.g.scale -= dt * 6) > 0);
  particles = particles.filter(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 12 * dt; return (p.life -= dt) > 0; });
  beams = beams.filter(b => (b.life -= dt * 3) > 0);
  popups = popups.filter(p => { if (!p.ring && !p.ray) p.y -= dt * .8; return (p.life -= dt * (p.ring || p.ray ? 3 : 1.2)) > 0; });
  if (waiters.length && settled()) { const w = waiters; waiters = []; w.forEach(f => f()); }
  // ヒント
  if (playing && !busy) {
    idleTime += dt;
    if (idleTime > 5 && !hintMove) hintMove = findMove();
  }
}

function draw(t) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, W);
  // マス目
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    ctx.fillStyle = (r + c) % 2 ? 'rgba(255,255,255,.05)' : 'rgba(255,255,255,.1)';
    ctx.fillRect(c * cell, r * cell, cell, cell);
  }
  if (selected) {
    ctx.fillStyle = 'rgba(255,212,59,.25)';
    ctx.fillRect(selected[1] * cell, selected[0] * cell, cell, cell);
  }
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, W); ctx.clip();
  const s = cell * .4;
  const drawAt = (g, extra = 1) => {
    if (g.y < -1) return;
    ctx.save();
    ctx.translate((g.x + .5) * cell, (g.y + .5) * cell);
    ctx.scale(g.scale * extra, g.scale * extra);
    drawGemShape(ctx, g, s, t);
    ctx.restore();
  };
  let hintSet = null;
  if (hintMove) hintSet = [grid[hintMove[0]][hintMove[1]], grid[hintMove[2]][hintMove[3]]];
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const g = grid[r][c]; if (!g) continue;
    let extra = 1;
    if (hintSet && hintSet.includes(g)) extra = 1 + .1 * Math.sin(t * 8);
    if (selected && selected[0] === r && selected[1] === c) extra = 1.12;
    drawAt(g, extra);
  }
  for (const d of dying) { ctx.globalAlpha = Math.max(0, d.g.scale); drawAt(d.g); ctx.globalAlpha = 1; }
  // ビーム
  for (const b of beams) {
    ctx.globalAlpha = b.life;
    const col = b.color >= 0 ? COLORS[b.color].light : '#fff';
    const th = cell * .5 * b.life;
    const grd = b.dir === 'h' ? ctx.createLinearGradient(0, (b.i + .5) * cell - th, 0, (b.i + .5) * cell + th) : ctx.createLinearGradient((b.i + .5) * cell - th, 0, (b.i + .5) * cell + th, 0);
    grd.addColorStop(0, 'rgba(255,255,255,0)'); grd.addColorStop(.5, '#fff'); grd.addColorStop(.5, col); grd.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = grd;
    if (b.dir === 'h') ctx.fillRect(0, (b.i + .5) * cell - th, W, th * 2); else ctx.fillRect((b.i + .5) * cell - th, 0, th * 2, W);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  // パーティクル
  for (const p of particles) {
    ctx.globalAlpha = Math.min(1, p.life * 2);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x * cell, p.y * cell, p.size * cell, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (const p of popups) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.5));
    if (p.ring) {
      ctx.beginPath(); ctx.arc(p.x * cell, p.y * cell, (1 - p.life) * p.rad * cell + cell * .3, 0, Math.PI * 2);
      ctx.lineWidth = cell * .2 * p.life; ctx.strokeStyle = '#fff'; ctx.stroke();
    } else if (p.ray) {
      ctx.beginPath(); ctx.moveTo(p.x0 * cell, p.y0 * cell); ctx.lineTo(p.x * cell, p.y * cell);
      ctx.lineWidth = cell * .08; ctx.strokeStyle = '#fff'; ctx.stroke();
    } else {
      ctx.font = `bold ${Math.round(cell * .42)}px sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(60,20,120,.9)'; ctx.strokeText(p.text, p.x * cell, p.y * cell);
      ctx.fillStyle = '#fff'; ctx.fillText(p.text, p.x * cell, p.y * cell);
    }
  }
  ctx.globalAlpha = 1;
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (grid) { update(dt, now / 1000); draw(now / 1000); }
  requestAnimationFrame(frame);
}

// ===== 入力 =====
let drag = null;
function cellFromEvent(e) {
  const rect = canvas.getBoundingClientRect();
  const c = Math.floor((e.clientX - rect.left) / rect.width * N), r = Math.floor((e.clientY - rect.top) / rect.height * N);
  return (r >= 0 && r < N && c >= 0 && c < N) ? [r, c] : null;
}
canvas.addEventListener('pointerdown', e => {
  unlockAudio();
  if (busy || !playing) return;
  const p = cellFromEvent(e); if (!p) return;
  drag = { r: p[0], c: p[1], x: e.clientX, y: e.clientY, moved: false };
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!drag || drag.moved || busy) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  const th = canvas.getBoundingClientRect().width / N * .35;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < th) return;
  drag.moved = true;
  let r2 = drag.r, c2 = drag.c;
  if (Math.abs(dx) > Math.abs(dy)) c2 += Math.sign(dx); else r2 += Math.sign(dy);
  if (r2 >= 0 && r2 < N && c2 >= 0 && c2 < N) trySwap(drag.r, drag.c, r2, c2);
});
canvas.addEventListener('pointerup', e => {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.moved || busy) return;
  if (selected) {
    const [sr, sc] = selected;
    if (Math.abs(sr - d.r) + Math.abs(sc - d.c) === 1) { trySwap(sr, sc, d.r, d.c); return; }
    selected = (sr === d.r && sc === d.c) ? null : [d.r, d.c];
  } else selected = [d.r, d.c];
});
canvas.addEventListener('pointercancel', () => { drag = null; });

// ===== 起動 =====
resize();
cfg = levelConfig(Math.min(unlocked, 1));
score = 0; movesLeft = cfg.moves; collected = {};
fillBoard(); updateHud();
requestAnimationFrame(frame);
openTitle();
</script>
</body>
</html>
