# 更新のお知らせ: Google Play で新しい版が公開されたら、version.json の
# android.latest を自動で上げる（.github/scripts/android-latest.mjs）。
name: Android latest
on:
  schedule:
    - cron: '47 */6 * * *' # 6時間ごと（iOS とずらす）
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/android-latest.mjs
      - name: Commit and push
        run: |
          if git diff --quiet -- '*/version.json'; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898333+github-actions[bot]@users.noreply.github.com'
          git add -- '*/version.json'
          git commit -m "Android latest: follow Google Play"
          git pull --rebase
          git push
