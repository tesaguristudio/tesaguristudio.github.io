# 更新のお知らせ: App Store で新しい版が公開されたら、version.json の
# ios.latest を自動で上げる（.github/scripts/ios-latest.mjs）。
name: iOS latest
on:
  schedule:
    - cron: '17 */6 * * *' # 6時間ごと
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/ios-latest.mjs
      - name: Commit and push
        run: |
          if git diff --quiet -- '*/version.json'; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898333+github-actions[bot]@users.noreply.github.com'
          git add -- '*/version.json'
          git commit -m "iOS latest: follow the App Store"
          git push
