<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>oshicase デモ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 推しを大事にする手帳。やさしく、かわいく、でも道具として速い
   IDEA: 紙のチケットの半券。現場は切り取り線のついたチケットとして並ぶ
   PICTURE: ホームの「次の現場」の大きな半券と、カウントダウンの数字
   COLOUR and TYPE: 地は白、推しカラーが全体の主役（推しを切り替えると全部変わる）。Zen Maru Gothic
   LAYOUT: スマホのアプリそのもの。上に推しの切り替え、下に4つのタブ */
:root{color-scheme:light dark;--bg:light-dark(#fff8f5,#17131a);--card:light-dark(#ffffff,#231d27);--ink:light-dark(#2a2129,#f5edf2);--sub:light-dark(#857781,#a99aa5);--line:light-dark(#f0e3e8,#352c39);--oshi:#ff4f86;--soft:color-mix(in srgb,var(--oshi) 14%,var(--card))}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--oshi);outline-offset:2px}
.app{max-width:440px;margin:0 auto;min-height:100%;position:relative;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
@media(min-width:520px){body{padding:24px 0;background:light-dark(#f3e9ee,#0e0b10)}.app{min-height:860px;border-radius:36px;background:var(--bg);box-shadow:0 20px 60px #0002;overflow:hidden}}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.brand .rt{display:flex;align-items:center;gap:6px}.gear{width:44px;height:44px;border:0;border-radius:50%;background:none;display:grid;place-items:center;color:var(--sub)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;border-left:0;border-right:0;border-top:0;background:none;text-align:left}.sw:last-child{border-bottom:0}.sw b{display:block;font-size:16px;color:var(--ink)}.sw span{font-size:13px;color:var(--sub)}
.sw i{flex:none;width:52px;height:32px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}.sw i::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:transform .2s}.sw[aria-checked=true] i{background:var(--oshi)}.sw[aria-checked=true] i::after{transform:translateX(20px)}.sw:disabled{opacity:.45}
.hidden-note{font-size:14px;color:var(--sub);text-align:center}
.brand b{font-size:22px;font-weight:900;letter-spacing:.01em}.brand b i{font-style:normal;color:var(--oshi)}
.demo{font-size:12px;color:var(--sub);text-align:right;line-height:1.3}
.oshis{display:flex;gap:8px;overflow-x:auto;padding:2px;scrollbar-width:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;min-height:40px;padding:4px 14px 4px 4px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:15px}
.chip .dot{width:30px;height:30px;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#fff;font-size:14px}
.chip.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--card))}
main{padding:6px 16px 24px}
h2{font-size:17px;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
h2 small{font-size:13px;color:var(--sub);font-weight:500}
.card{background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:0 1px 0 var(--line),0 6px 18px light-dark(#e9d6de66,#0004)}
/* チケット */
.ticket{display:grid;grid-template-columns:1fr 96px;background:var(--oshi);color:#fff;border-radius:22px;position:relative;overflow:hidden;box-shadow:0 12px 30px color-mix(in srgb,var(--oshi) 40%,transparent);border:0;text-align:left;width:100%;padding:0}
.ticket .l{padding:16px 16px 18px}
.ticket .r{border-left:2px dashed #ffffff88;display:grid;place-items:center;text-align:center;padding:10px 4px;background:#ffffff1a}
.ticket::before,.ticket::after{content:"";position:absolute;right:87px;width:20px;height:20px;border-radius:50%;background:var(--bg)}
.ticket::before{top:-10px}.ticket::after{bottom:-10px}
.ticket .k{font-size:13px;opacity:.9}.ticket .t{font-size:20px;font-weight:900;line-height:1.3;margin:4px 0 8px;text-wrap:balance}
.ticket .m{font-size:14px;opacity:.95}
.ticket .n{font-size:44px;font-weight:900;line-height:1}.ticket .u{font-size:13px}
.ticket .glow{position:absolute;right:-30px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(#ffffff55,transparent 70%);pointer-events:none}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:1px 9px;border-radius:999px;background:#ffffff33}
/* やること */
.todo{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.todo:last-child{border:0}
.chk{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--c,var(--oshi));background:none;display:grid;place-items:center;padding:0}
.chk.on{background:var(--c,var(--oshi))}.chk.on::after{content:"";width:9px;height:5px;border:3px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.todo .x{flex:1}.todo .x b{display:block;font-size:15px}.todo .x span{font-size:13px;color:var(--sub)}
.todo .when{font-size:13px;font-weight:700;white-space:nowrap;color:var(--c)}
.todo.done .x b{text-decoration:line-through;color:var(--sub)}
.urgent{color:#fff!important;background:var(--c);padding:2px 8px;border-radius:999px}
/* 記念日・ウィジェット */
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.wid{aspect-ratio:1;border-radius:24px;padding:14px;background:var(--c);color:#fff;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.wid .s{font-size:13px;opacity:.92}.wid .big{font-size:clamp(30px,10vw,40px);font-weight:900;line-height:1}.wid .big small{font-size:14px;margin-left:2px}
.wid::after{content:"";position:absolute;right:-24px;bottom:-24px;width:90px;height:90px;border-radius:50%;background:#ffffff22}
.wid.lt{background:var(--card);color:var(--ink);border:2px solid var(--c)}.wid.lt .big{color:var(--c)}.wid.lt::after{background:color-mix(in srgb,var(--c) 14%,transparent)}
.wmid{grid-column:1/-1;aspect-ratio:auto;flex-direction:row;gap:14px;align-items:center;min-height:150px}
.wmid .col{flex:1;display:flex;flex-direction:column;gap:6px}
.wmid .line{font-size:13px;background:#ffffff26;border-radius:10px;padding:6px 10px}
.cap{font-size:13px;color:var(--sub);margin:8px 2px 0}
/* 現場一覧 */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--line);border-radius:999px;padding:4px;margin:8px 0 4px}
.seg button{border:0;background:none;min-height:40px;border-radius:999px;font-weight:700;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 6px #0001}
.month{font-size:14px;color:var(--sub);font-weight:700;margin:18px 4px 8px}
.ev{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;margin-bottom:10px;position:relative;overflow:hidden}
.ev::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.ev .d{text-align:center;line-height:1.1}.ev .d b{display:block;font-size:24px;font-weight:900;color:var(--c)}.ev .d span{font-size:12px;color:var(--sub)}
.ev .t{font-weight:700;font-size:15px;line-height:1.35}.ev .v{font-size:13px;color:var(--sub)}
.st{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;background:color-mix(in srgb,var(--c) 16%,var(--card));color:var(--c)}
.st.lose{background:var(--line);color:var(--sub)}
.empty{text-align:center;color:var(--sub);padding:40px 10px}
/* カレンダー */
.calh{display:flex;align-items:center;justify-content:space-between;margin:8px 0}
.calh b{font-size:20px;font-weight:900}
.icon{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);display:grid;place-items:center;box-shadow:0 1px 0 var(--line)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal .w{font-size:12px;color:var(--sub);padding:4px 0}
.cal .w:first-child{color:#e0526a}.cal .w:last-child{color:#4a7bdc}
.day{aspect-ratio:1/1.1;border:0;border-radius:14px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;font-size:15px;gap:3px}
.day.out{visibility:hidden}.day.today{outline:2px solid var(--oshi)}.day.sel{background:var(--oshi);color:#fff}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}.dots i{width:7px;height:7px;border-radius:50%;background:var(--c)}.dots i.dl{background:none;border:2px solid var(--c);width:7px;height:7px}
.legend{font-size:13px;color:var(--sub);display:flex;gap:16px;margin:10px 4px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--sub);margin-right:4px;vertical-align:1px}.legend i.dl{background:none;border:2px solid var(--sub)}
/* まとめ */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{text-align:center;padding:14px 6px}.stat b{display:block;font-size:clamp(24px,7vw,30px);font-weight:900;color:var(--oshi);line-height:1.1;white-space:nowrap}.stat span{font-size:12px;color:var(--sub)}
.bar{margin:10px 0}.bar .lab{display:flex;justify-content:space-between;font-size:14px}.bar .lab span:last-child{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.bar .tr{height:12px;border-radius:99px;background:var(--line);margin-top:4px;overflow:hidden}.bar .fl{height:100%;border-radius:99px;background:var(--c,var(--oshi))}
.budget .tr{height:16px}
.share{background:var(--oshi);color:#fff;border-radius:26px;padding:22px 20px;position:relative;overflow:hidden;min-height:360px;display:flex;flex-direction:column}
.share .yr{font-size:14px;opacity:.9}.share h3{font-size:28px;font-weight:900;margin:2px 0 14px;line-height:1.15}
.share .row{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px dashed #ffffff66;padding:9px 0;font-size:15px}.share .row b{font-size:24px;font-weight:900;white-space:nowrap}
.share .foot{margin-top:auto;padding-top:18px;font-size:12px;opacity:.85;display:flex;justify-content:space-between}
.share .ring{position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;border:26px solid #ffffff22}
.btn{display:block;width:100%;min-height:50px;border:0;border-radius:999px;background:var(--oshi);color:#fff;font-weight:900;font-size:16px;margin-top:12px}
.btn.ghost{background:var(--soft);color:var(--oshi)}
/* 下のタブ */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;z-index:6;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(8px + env(safe-area-inset-bottom))}
@media(min-width:520px){nav{position:absolute;bottom:0}}
nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--sub);min-height:52px;justify-content:center}
nav button svg{width:26px;height:26px}
nav button.on{color:var(--oshi)}
nav .add{width:58px;height:58px;border-radius:50%;background:var(--oshi);color:#fff;margin:-22px auto 0;box-shadow:0 8px 18px color-mix(in srgb,var(--oshi) 45%,transparent)}
nav .add svg{width:30px;height:30px}
/* シート */
.scrim{position:fixed;inset:0;background:#0006;z-index:10;display:none;align-items:flex-end;justify-content:center}
.scrim.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:440px;max-height:92vh;overflow-y:auto;border-radius:28px 28px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom));animation:up .28s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.shead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.shead h3{margin:0;font-size:20px;line-height:1.3}
.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin:14px 0 6px}
.step{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--sub);font-weight:700;min-height:48px}
.step i{width:100%;height:8px;border-radius:9px;background:var(--line)}
.step.on{color:var(--c)}.step.on i{background:var(--c)}
.kv{display:grid;grid-template-columns:5.5em 1fr;gap:6px 10px;font-size:15px}.kv dt{color:var(--sub);font-size:14px}.kv dd{margin:0}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ph{aspect-ratio:1;border-radius:14px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 70%,#1a1030),#1a1030);position:relative;overflow:hidden}
.ph::before{content:"";position:absolute;left:10%;right:10%;bottom:-30%;height:70%;border-radius:50%;background:radial-gradient(color-mix(in srgb,var(--c) 80%,#fff),transparent 70%)}
.ph::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,transparent 0 14px,#ffffff14 14px 16px)}
.ph.add{background:var(--card);border:2px dashed var(--line);display:grid;place-items:center;color:var(--sub);font-size:13px}.ph.add::before,.ph.add::after{display:none}
ol.set{margin:0;padding-left:1.6em;font-size:15px}ol.set li{padding:2px 0}
textarea{width:100%;min-height:90px;border-radius:14px;border:2px solid var(--line);background:var(--card);padding:10px 12px;font-size:16px;resize:vertical}
.field{display:block;margin:12px 0}.field span{display:block;font-size:14px;color:var(--sub);margin-bottom:4px}
.field input,.field select{width:100%;min-height:48px;border-radius:14px;border:2px solid var(--line);background:var(--card);padding:8px 12px;font-size:16px}
.stars{display:flex;gap:2px}.stars button{border:0;background:none;font-size:26px;padding:0 2px;color:var(--line);min-width:36px;min-height:40px}.stars button.on{color:var(--c)}
.lose-t{border:0;background:none;color:var(--sub);text-decoration:underline;font-size:14px;min-height:40px;padding:0}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
/* 落選・見送り */
.off{filter:grayscale(1);opacity:.55}
.st.lose{background:none;color:var(--sub);border:1.5px dashed var(--sub);padding:1.5px 8.5px}
.dots i.off,.legend i.off{background:var(--sub);opacity:.5}
.outs{display:flex;gap:20px}
/* 注意・折りたたみ */
.warn{display:flex;gap:10px;align-items:flex-start;margin:10px 0;padding:10px 12px;border-radius:14px;font-size:14px;line-height:1.5;background:light-dark(#fff1d1,#3b2f14);color:light-dark(#6b4a00,#ffdc8a)}
.warn b{flex:none;width:22px;height:22px;border-radius:50%;background:light-dark(#e8a200,#ffc940);color:light-dark(#fff,#2a2000);display:grid;place-items:center;font-size:14px;font-weight:900}
.more summary{list-style:none;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:8px;font-weight:700;color:var(--oshi);font-size:15px}
.more summary::-webkit-details-marker{display:none}
.more summary::before{content:"＋";flex:none;width:22px;height:22px;border-radius:50%;background:color-mix(in srgb,var(--oshi) 14%,var(--card));display:grid;place-items:center;font-size:13px}
.more[open] summary::before{content:"－"}
.more summary small{font-weight:500;color:var(--sub);font-size:13px}
.acts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:10px}
/* お金の行・立替 */
.cr{padding:8px 0;border-bottom:1px solid var(--line)}
.crh{display:flex;justify-content:space-between;gap:10px;font-size:15px}.crh b{font-variant-numeric:tabular-nums;white-space:nowrap}.crh small{margin-left:8px;font-size:12px;color:var(--sub)}
.crs{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--sub)}
.mchk{border:0;background:none;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);min-height:40px;padding:0}
.mchk::before{content:"";flex:none;width:20px;height:20px;border-radius:6px;border:2px solid var(--c,var(--oshi));display:grid;place-items:center;font-size:12px;color:#fff;line-height:1}
.mchk.on{color:var(--ink)}.mchk.on::before{content:"✓";background:var(--c,var(--oshi))}
/* セトリ */
ul.set{list-style:none;margin:0;padding:0;font-size:15px}
ul.set li{display:flex;align-items:baseline;gap:8px;padding:3px 0}
ul.set .no{flex:none;width:1.4em;text-align:right;color:var(--sub);font-size:13px;font-variant-numeric:tabular-nums}
ul.set .tg{flex:none;font-size:11px;font-weight:700;padding:0 7px;border-radius:999px;line-height:1.8;background:color-mix(in srgb,var(--c) 16%,var(--card));color:var(--c)}
ul.set li.mc{color:var(--sub)}ul.set li.mc .tg{background:var(--line);color:var(--sub)}
/* 写真・アルバム */
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
label.ph.add{cursor:pointer}.ph.add:focus-within{outline:3px solid var(--oshi);outline-offset:2px}
.ph.img{background:var(--line)}.ph.img::before,.ph.img::after{display:none}.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.albh{display:flex;align-items:baseline;gap:8px;width:100%;border:0;background:none;text-align:left;padding:16px 2px 8px;min-height:44px}
.albh b{flex:none;color:var(--c);font-size:14px}.albh span{flex:1;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.albh small{flex:none;color:var(--sub);font-size:13px}
.bk{margin:4px 0 0;font-size:15px}.bk b{font-weight:700}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><b>oshi<i>case</i></b><span class="rt"><span class="demo">デモ・架空のデータ<br>今日は2026/11/27</span><button class="gear" data-set aria-label="設定"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button></span></div>
    <div class="oshis" id="oshis"></div>
  </header>
  <main id="view"></main>
  <nav id="nav">
    <button data-tab="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>ホーム</button>
    <button data-tab="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7h18v3a2 2 0 000 4v3H3v-3a2 2 0 000-4z"/><path d="M15 7v10" stroke-dasharray="2 2"/></svg>現場</button>
    <button data-tab="new" aria-label="現場を追加"><span class="add" style="display:grid;place-items:center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></button>
    <button data-tab="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>カレンダー</button>

 return `<h2>2026年<small>1月〜今日まで</small></h2><div class="stats"><div class="card stat"><b>${went.length}</b><span>行った現場</span></div><div class="card stat"><b>${rate}%</b><span>当選率</span></div>${SET.money?`<div class="card stat"><b>${(tot/10000).toFixed(1)}万</b><span>使ったお金</span></div>`:`<div class="card stat"><b>${Object.keys(vc).length}</b><span>行った会場</span></div>`}</div>
 ${SET.money?`<p class="cap">お金は自己負担の分だけ。立て替えた分は入りません</p><h2>12月の予算<small>${yen(budget)}</small></h2><div class="card budget"><div class="bar"><div class="lab"><span>予定に入っている分</span><span>${yen(usedM)}</span></div><div class="tr"><div class="fl" style="width:${Math.min(100,usedM/budget*100)}%"></div></div></div><p class="cap" style="margin:6px 0 0">あと ${yen(Math.max(0,budget-usedM))} 使えます</p></div>
 ${lb}<h2>費目ごと</h2><div class="card">${cb||'<div class="empty">まだ記録がありません</div>'}</div>${ob}`:`<h2>お金</h2><div class="card hidden-note">金額は表示しない設定になっています<button class="btn ghost" data-set>設定をひらく</button></div>`}
 <h2>1年のまとめ画像<small>SNSにシェア</small></h2><div class="share"><div class="ring"></div><div class="yr">2026年の推し活</div><h3>${name}の1年</h3><div class="row"><span>行った現場</span><b>${went.length}回</b></div><div class="row"><span>当選率</span><b>${rate}%</b></div><div class="row"><span>いちばん行った会場</span><b style="font-size:16px">${topV?esc(topV[0]):'—'}</b></div>${SET.money&&SET.shareMoney?`<div class="row"><span>推しに使ったお金</span><b>${yen(tot)}</b></div>`:`<div class="row"><span>行った会場</span><b>${Object.keys(vc).length}か所</b></div>`}<div class="foot"><span>#oshicase</span><span>oshicase</span></div></div><button class="btn" data-share>画像を保存する</button>`}
function render(){setColor();renderOshis();$('#view').innerHTML=tab==='home'?home():tab==='list'?list():tab==='cal'?cal():summary();document.querySelectorAll('nav [data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab))}
function openSheet(h){$('#sheet').innerHTML='<div class="grab"></div>'+h;$('#sheet').dataset.id='';$('#scrim').classList.add('open')}
function closeSheet(){$('#scrim').classList.remove('open')}
const openId=()=>$('#scrim').classList.contains('open')?Number($('#sheet').dataset.id||0):0;
const SETRE=/^(MC|EN\d*|アンコール|メドレー)(?![A-Za-z])[\s:：.．\-－・)）]*/i;
const setTag=s=>{const m=s.match(SETRE);return m?[/^MC/i.test(m[1])?'MC':m[1]==='メドレー'?'メドレー':'EN',s.slice(m[0].length)]:['',s]};
function setHtml(a){let n=0;return a.length?`<ul class="set">${a.map(s=>{const[tg,t]=setTag(s);return `<li class="${tg==='MC'?'mc':''}"><span class="no">${tg==='MC'?'':++n}</span>${tg?`<span class="tg">${tg}</span>`:''}<span>${esc(t)}</span></li>`}).join('')}</ul>`:'<p class="cap" style="margin:0">まだありません</p>'}
const songs=a=>a.filter(s=>setTag(s)[0]!=='MC').length;
function detail(id){
 const e=EV.find(x=>x.id===id),o=O(e.o),c=o.color,past=!e.out&&(e.st===5||days(e.date)<0);
 const steps=STEPS.map((s,i)=>`<button class="step ${!e.out&&i<=e.st?'on':''}" data-step="${i}"><i></i>${s}</button>`).join('');
 const outs=e.out?`<button class="lose-t" data-out="">「${stName(e)}」を取り消す</button>`:`<button class="lose-t" data-out="lose">落選だった</button><button class="lose-t" data-out="skip">見送る</button>`;
 const kv=[['推し',`${esc(o.name)}（${esc(o.group)}）`],['日時',`${md(e.date)} ${e.time}`],['会場',esc(e.venue)],['座席',esc(e.seat||'—')],['同行者',esc(e.with||'—')],['名義',esc(e.nm||'—')],['申込先',esc(e.via||'—')],['通知元',esc(e.ntf||'—')]];
 const paid=e.cost.reduce((a,r)=>a+r.v,0),lent=paid-sum(e);
 const money=SET.money?`<h2>お金<small>自己負担 ${yen(sum(e))}</small></h2><div class="card">${e.cost.map((r,i)=>`<div class="cr"><div class="crh"><span>${esc(r.k)}${r.n>1?`<small>${r.n}人分</small>`:''}</span><b>${yen(r.v)}</b></div>${r.lend?`<div class="crs"><span>立替 ${yen(r.lend)}</span><button class="mchk ${r.back?'on':''}" role="checkbox" aria-checked="${!!r.back}" data-back="${e.id}:${i}">回収済み</button></div>`:''}</div>`).join('')||'<p class="cap" style="margin:0">まだありません</p>'}
  ${lent?`<p class="cap">払った ${yen(paid)} − 立替 ${yen(lent)} ＝ 自己負担 ${yen(sum(e))}</p>`:''}
  <details class="more"><summary>費用を追加</summary><div class="grid2"><label class="field"><span>費目</span><select id="ck">${CK.map(k=>`<option>${k}</option>`).join('')}</select></label><label class="field"><span>払った額</span><input id="cv" type="number" inputmode="numeric" min="0" placeholder="9800"></label><label class="field"><span>何人分</span><select id="cn">${[1,2,3,4,5,6].map(n=>`<option value="${n}">${n}人分</option>`).join('')}</select></label><label class="field"><span>うち立替</span><input id="cl" type="number" inputmode="numeric" min="0" placeholder="0"></label></div><button class="btn ghost" data-costadd>追加する</button></details></div>`:'';
 const memories=past?`<h2>思い出<small>${nPh(e)}枚</small></h2><div class="photos">${phTiles(e)}<label class="ph add">＋写真<input id="phin" class="vh" type="file" accept="image/*" multiple></label></div>
 <h2>セトリ<small>${e.set.length?songs(e.set)+'曲':''}</small></h2><div class="card"><div id="setv">${setHtml(e.set)}</div><details class="more"><summary>${e.set.length?'貼り付けて直す':'まとめて貼り付ける'}<small>1行に1曲</small></summary><textarea id="setin" placeholder="MC・EN・アンコール・メドレーで始まる行には印がつきます">${esc(e.set.join('\n'))}</textarea></details></div>
 <h2>よかった度</h2><div class="stars">${[1,2,3,4,5].map(n=>`<button class="${n<=e.stars?'on':''}" data-star="${n}" aria-label="${n}">★</button>`).join('')}</div>`:'';
 openSheet(`<div style="--c:${c};--oshi:${c}"><div class="shead"><div><span class="st ${e.out?'lose':''}">${stName(e)}</span><h3>${esc(e.title)}</h3></div>${CLOSE}</div>
 <div class="steps">${steps}</div><div class="outs">${outs}</div>${e.out?'':warnHtml(clash(e.date,e.time,e.id))}
 <h2>現場</h2><div class="card"><dl class="kv">${kv.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl></div>
 <h2>締切<small>${e.out?'通知しません':'通知します'}</small></h2><div class="card">${e.dl.map((d,i)=>`<div class="todo ${d.done?'done':''} ${e.out?'off':''}" style="--c:${c}"><button class="chk ${d.done?'on':''}" data-dl="${e.id}:${i}" aria-label="済みにする"></button><div class="x"><b>${esc(d.l)}</b><span>${md(d.at)} ${d.at.slice(11,16)}</span></div><span class="when">${d.done?'済':whenTxt(d.at)}</span></div>`).join('')}
  <details class="more"><summary>締切を追加</summary><label class="field"><span>種類</span><select id="dk">${DLK.map(k=>`<option>${k}</option>`).join('')}</select></label><label class="field"><span>日時</span><input id="da" type="datetime-local"></label><button class="btn ghost" data-dladd>追加する</button></details></div>
 ${money}${memories}
 <h2>メモ・感想</h2><textarea id="memo" placeholder="今日のこと、忘れないうちに">${esc(e.memo)}</textarea>
 <div class="acts"><button class="btn ghost" data-edit>編集する</button><button class="btn ghost" data-dup>この現場を複製</button></div></div>`);
 $('#sheet').dataset.id=id;
 $('#memo').addEventListener('input',ev=>{e.memo=ev.target.value});
 $('#setin')?.addEventListener('input',ev=>{e.set=ev.target.value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);$('#setv').innerHTML=setHtml(e.set)});
 $('#phin')?.addEventListener('change',ev=>{const fs=[...ev.target.files].filter(f=>f.type.startsWith('image/'));if(!fs.length)return;e.photos=(e.photos||[]).concat(fs.map(f=>URL.createObjectURL(f)));render();detail(id);toast(`写真を${fs.length}枚追加しました`)});
 const autoLend=()=>{const v=Number($('#cv').value||0),n=Number($('#cn').value);$('#cl').value=n>1&&v?Math.round(v*(n-1)/n):''};
 $('#cv')?.addEventListener('input',autoLend);$('#cn')?.addEventListener('change',autoLend)}
function settings(){
 openSheet(`<div class="shead"><h3>設定</h3>${CLOSE}</div>
 <h2>お金の表示</h2><div class="card">
 <button class="sw" role="switch" aria-checked="${SET.money}" data-sw="money"><span><b>金額を表示する</b><span>オフにすると、一覧・現場・まとめから金額と予算、立替が消えます。入力済みの記録は残ります</span></span><i></i></button>
 <button class="sw" role="switch" aria-checked="${SET.money&&SET.shareMoney}" data-sw="shareMoney" ${SET.money?'':'disabled'}><span><b>まとめ画像に金額を入れる</b><span>SNSに載せる画像だけ金額を外せます</span></span><i></i></button></div>
 <h2>日数の数え方</h2><div class="card">
 <button class="sw" role="switch" aria-checked="${SET.day1}" data-sw="day1"><span><b>推し始めた日を1日目にする</b><span>オフのときは、推し始めた日の翌日が1日目です</span></span><i></i></button></div>
 <h2>バックアップ</h2><div class="card"><p class="bk">最後のバックアップ：<b>${bk}</b></p><p class="cap" style="margin:2px 0 0">機種変更や削除に備えて、記録と写真をまとめて保存します</p><button class="btn ghost" data-backup>今すぐバックアップ</button></div>
 <p class="cap">デモでは、表示の設定はこのブラウザに保存されます。</p>`)}
function addForm(mode='new',src=null){
 const p=src||{o:cur==='all'?'hinata':cur,title:'',time:'',venue:'',with:'',nm:'',via:'',ntf:''};
 const date=mode==='edit'?src.date:'',tk=src?.cost.find(r=>r.k==='チケット');
 const val=s=>s?`value="${esc(s)}"`:'';
 openSheet(`<div class="shead"><h3>${{new:'現場を追加',dup:'現場を複製',edit:'現場を編集'}[mode]}</h3>${CLOSE}</div>
 ${mode==='dup'?'<p class="cap">日付を入れてください。ステータス・写真・メモ・締切はコピーしません</p>':''}
 <form id="f"><label class="field"><span>推し</span><select id="fo">${OSHI.map(o=>`<option value="${o.id}" ${o.id===p.o?'selected':''}>${esc(o.name)}（${esc(o.group)}）</option>`).join('')}</select></label>
 <label class="field"><span>公演・イベント名</span><input id="ft" required placeholder="例：冬ツアー 福岡公演" ${val(p.title)}></label>
 <label class="field"><span>日付</span><input id="fd" type="date" required ${val(date)}></label>
 <div id="fw"></div>
 <details class="more" ${mode==='new'?'':'open'}><summary>くわしく<small>開演・会場・名義など。あとからでも</small></summary>
 <div class="grid2"><label class="field"><span>開演</span><input id="fh" type="time" ${val(p.time)}></label><label class="field"><span>同行者</span><input id="fwith" placeholder="例：みき" ${val(p.with)}></label></div>
 <label class="field"><span>会場</span><input id="fv" placeholder="例：マリンメッセ福岡" ${val(p.venue==='未定'?'':p.venue)}></label>
 <label class="field"><span>名義</span><input id="fn" placeholder="例：自分（FC会員）" ${val(p.nm)}></label>
 <label class="field"><span>申込先</span><input id="fp" placeholder="例：FC先行、プレイガイド一般" ${val(p.via)}></label>
 <label class="field"><span>結果の通知元</span><input id="fr" placeholder="例：FCサイトのマイページ、メール" ${val(p.ntf)}></label>
 ${mode==='edit'?'':`<label class="field"><span>締切の種類</span><select id="fk">${DLK.map(k=>`<option>${k}</option>`).join('')}</select></label><label class="field"><span>締切の日時（通知します）</span><input id="fl" type="datetime-local"></label>
 ${SET.money?`<label class="field"><span>チケット代</span><input id="fc" type="number" inputmode="numeric" min="0" placeholder="9800" ${tk?`value="${tk.v}"`:''}></label>`:''}`}
 </details>
 <button class="btn" type="submit">${mode==='edit'?'保存する':'追加する'}</button></form>`);
 const upd=()=>{$('#fw').innerHTML=warnHtml(clash($('#fd').value,$('#fh').value,src&&mode==='edit'?src.id:0))};
 $('#fd').addEventListener('input',upd);$('#fh').addEventListener('input',upd);upd();
 $('#f').addEventListener('submit',ev=>{ev.preventDefault();const t=$('#ft').value.trim(),d=$('#fd').value;if(!t||!d)return;
  const v=id=>($('#'+id)?.value||'').trim();
  const f={o:$('#fo').value,title:t,date:d,time:v('fh'),venue:v('fv')||'未定',with:v('fwith'),nm:v('fn'),via:v('fp'),ntf:v('fr')};
  if(mode==='edit'){Object.assign(src,f);render();detail(src.id);toast('保存しました');return}
  const e={id:nid++,...f,st:0,seat:'',dl:[],cost:[],set:[],memo:'',stars:0};
  if(v('fl'))e.dl.push({l:$('#fk').value,at:v('fl'),done:false});
  const c=Math.round(Number(v('fc')||0));if(c>0)e.cost.push({k:'チケット',v:c});
  EV.push(e);closeSheet();tab='list';seg=days(e.date)>=0?'up':'past';render();window.scrollTo(0,0);toast(e.dl.length?'追加しました。締切の前日と当日に通知します':'追加しました')})}
const SWMSG={money:['金額を表示します','金額を表示しません'],shareMoney:['まとめ画像に金額を入れます','まとめ画像から金額を外します'],day1:['推し始めた日を1日目にします','推し始めた日の翌日を1日目にします']};
document.addEventListener('click',ev=>{
 const t=ev.target.closest('button');if(!t)return;
 if(t.dataset.o){cur=t.dataset.o;render();return}
 if(t.dataset.tab){if(t.dataset.tab==='new'){addForm();return}tab=t.dataset.tab;render();window.scrollTo(0,0);return}
 if(t.dataset.seg){seg=t.dataset.seg;render();return}
 if(t.dataset.mon){calM=new Date(calM.getFullYear(),calM.getMonth()+Number(t.dataset.mon),1);selD=null;render();return}
 if(t.dataset.day){selD=selD===t.dataset.day?null:t.dataset.day;render();return}
 if(t.dataset.ev){detail(Number(t.dataset.ev));return}
 if(t.dataset.dl){const[id,i]=t.dataset.dl.split(':').map(Number);const d=EV.find(x=>x.id===id).dl[i];d.done=!d.done;render();if(openId()===id)detail(id);toast(d.done?'済みにしました':'未完了に戻しました');return}
 if(t.dataset.back){const[id,i]=t.dataset.back.split(':').map(Number);const r=EV.find(x=>x.id===id).cost[i];r.back=!r.back;render();if(openId()===id)detail(id);toast(r.back?'回収済みにしました':'未回収に戻しました');return}
 if(t.hasAttribute('data-close')){closeSheet();return}
 if(t.hasAttribute('data-set')){settings();return}
 if(t.dataset.sw){const k=t.dataset.sw;SET[k]=!(t.getAttribute('aria-checked')==='true');saveSet();render();settings();toast(SWMSG[k][SET[k]?0:1]);return}
 if(t.hasAttribute('data-share')){toast('アプリでは画像として保存されます（デモ）');return}
 if(t.hasAttribute('data-backup')){const n=new Date();bk=`今日 ${n.getHours()}:${String(n.getMinutes()).padStart(2,'0')}`;settings();toast('バックアップしました（デモ）');return}
 const sid=openId(),e=EV.find(x=>x.id===sid);if(!e)return;
 if(t.dataset.step){e.st=Number(t.dataset.step);e.out=undefined;render();detail(sid);toast(`「${STEPS[e.st]}」にしました`);return}
 if('out' in t.dataset){e.out=t.dataset.out||undefined;render();detail(sid);toast(e.out?`「${stName(e)}」にしました`:'取り消しました');return}
 if(t.dataset.star){e.stars=Number(t.dataset.star);detail(sid);return}
 if(t.hasAttribute('data-dladd')){const at=$('#da').value;if(!at){toast('日時を入れてください');return}e.dl.push({l:$('#dk').value,at,done:false});e.dl.sort((a,b)=>a.at.localeCompare(b.at));render();detail(sid);toast('締切を追加しました');return}
 if(t.hasAttribute('data-costadd')){const v=Math.round(Number($('#cv').value||0));if(!(v>0)){toast('金額を入れてください');return}const n=Number($('#cn').value),l=Math.min(v,Math.max(0,Math.round(Number($('#cl').value||0))));e.cost.push({k:$('#ck').value,v,n,lend:l,back:false});render();detail(sid);toast('費用を追加しました');return}
 if(t.hasAttribute('data-edit')){addForm('edit',e);return}
 if(t.hasAttribute('data-dup')){addForm('dup',e);return}
});
$('#scrim').addEventListener('click',ev=>{if(ev.target.id==='scrim')closeSheet()});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeSheet()});
render();
}
</script>
</body>
